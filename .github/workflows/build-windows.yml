name: build-windows

# Vérifie tout sous Linux, puis construit l'installeur Windows (.msi + .exe NSIS).
# - à chaque push (toutes branches) : installeurs disponibles en artefacts du workflow
# - sur un tag v* : brouillon de release GitHub avec les installeurs attachés

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Modèle de détourage (≈ 178 Mo) et ONNX Runtime : téléchargés au build (sommes
      # SHA-256 vérifiées), embarqués dans l'installeur, jamais téléchargés à l'exécution.
      - uses: actions/cache@v4
        with:
          path: .cache/figurine-downloads
          key: figurine-downloads-${{ hashFiles('outils/fetch-models.mjs') }}
      - run: npm run fetch-models

      - run: cargo test
        working-directory: src-tauri
        env:
          THESE_EXIGER_MODELE: "1"

      - name: Build + release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Thèse ${{ github.ref_name }}
          releaseDraft: true

      - name: Build (push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run construire -- these

      - name: Installeurs en artefacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: these-installeurs
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

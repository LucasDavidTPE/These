[package]
name = "these"
version = "1.5.1"
description = "Application de bureau de la thèse"
authors = ["Lucas David"]
edition = "2021"
publish = false

[lib]
# Nom distinct du binaire pour éviter un conflit de sortie sous Windows (recommandation Tauri 2).
name = "these_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
# Module Figures (détourage) : ONNX Runtime chargé dynamiquement depuis la DLL embarquée,
# décodage et encodage d'images. Absent de l'installeur « Traitement 2S2P1D ».
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"], optional = true }
ureq = "3"
# Export de l'espace en un seul fichier .zip (déjà dans l'arbre via le module de mise à jour).
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", optional = true }

[features]
default = ["figures"]
figures = ["dep:ort", "dep:image", "dep:clipboard-win"]

[dev-dependencies]
tempfile = "3"

# Le redimensionnement d'images est ~4× plus lent sans optimisation : on l'active aussi
# en développement pour ces seules dépendances.
[profile.dev.package.image]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

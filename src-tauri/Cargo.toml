[package]
name = "these"
version = "0.1.0"
description = "Application de bureau de la thèse"
authors = ["Lucas David"]
edition = "2021"
publish = false

[lib]
# Nom distinct du binaire pour éviter un conflit de sortie sous Windows (recommandation Tauri 2).
name = "these_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
